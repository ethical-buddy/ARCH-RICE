"$schema" = 'https://starship.rs/config-schema.json'

format = """
[░▒▓](cyan)\
[  ](bg:cyan fg:black)\
[](gen_bg:cyan bg:bright-black)\
$directory\
[](fg:bright-black bg:blue)\
$git_branch\
$git_status\
[](fg:blue bg:purple)\
$nodejs\
$rust\
$golang\
$python\
[](fg:purple bg:black)\
$character\
"""

[directory]
style = "bg:bright-black fg:white"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "bg:blue fg:black"
format = "[[ $symbol $branch ]($style)]($style)"

[git_status]
style = "bg:blue fg:black"
format = "[[($all_status$ahead_behind )]($style)]($style)"

[nodejs]
symbol = ""
style = "bg:purple fg:black"
format = "[[ $symbol ($version) ]($style)]($style)"

[rust]
symbol = ""
style = "bg:purple fg:black"
format = "[[ $symbol ($version) ]($style)]($style)"

[golang]
symbol = ""
style = "bg:purple fg:black"
format = "[[ $symbol ($version) ]($style)]($style)"

[python]
symbol = ""
style = "bg:purple fg:black"
format = "[[ $symbol ($version) ]($style)]($style)"

[character]
success_symbol = "[ 󰄬 ](fg:green)"
error_symbol = "[  ](fg:red)"
