# #######################################################################################
# EXTREME CYBER-HACKER LOCKSCREEN CONFIG
# #######################################################################################

general {
    no_fade_in = false
    grace = 0
    disable_loading = true
}

background {
    monitor =
    path = screenshot
    # color = rgba(0, 0, 0, 0.0) # Removed static color
    blur_passes = 4
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
}

# --- HACKER OVERLAY ---

# Time (Green Glow)
label {
    monitor =
    text = $TIME
    color = rgba(0, 255, 65, 0.9)
    font_size = 120
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 200
    halign = center
    valign = center
}

# System Status
label {
    monitor =
    text = 󰒄 SYSTEM ENCRYPTED |  $USER
    color = rgba(0, 255, 65, 0.7)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

# --- INPUT FIELD ---

input-field {
    monitor =
    size = 400, 60
    outline_thickness = 3
    dots_size = 0.2
    dots_spacing = 0.4
    dots_center = true
    outer_color = rgba(0, 255, 65, 0.3)
    inner_color = rgba(0, 0, 0, 0.7)
    font_color = rgb(0, 255, 65)
    fade_on_empty = false
    placeholder_text = <span foreground="##00ff41">root@arch: ~# access_token? </span>
    hide_input = false
    position = 0, -30
    halign = center
    valign = center
}
