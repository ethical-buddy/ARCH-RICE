# #######################################################################################
# HYPRLAND CONFIG - CLEAN RICE (5 WORKSPACES)
# #######################################################################################

monitor=,preferred,auto,1

###################
### MY PROGRAMS ###
###################

$terminal = kitty
$fileManager = dolphin
$menu = rofi -show drun
$browser = firefox

#################
### AUTOSTART ###
#################
exec-once = waybar & disown
exec-once = swww-daemon
exec-once = nm-applet &
exec-once = wal -R
# exec-once = hypridle
exec-once = ~/.config/hypr/scripts/resource_monitor.sh &
exec-once = ~/.config/hypr/wallpaper.sh

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_THEME,Bibata-Modern-Ice

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 8
    gaps_out = 25
    border_size = 2

    col.active_border = rgba(00ff41ee) rgba(00ff41ee) rgba(004411ee) 45deg
    col.inactive_border = rgba(2e3440aa)
   
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 12
    rounding_power = 3

    active_opacity = 1.0
    inactive_opacity = 0.85

    shadow {
        enabled = true
        range = 25
        render_power = 4
        color = rgba(000000aa)
    }

    blur {
        enabled = true
        size = 10
        passes = 4
        new_optimizations = true
        xray = true
        ignore_opacity = true
        vibrancy = 0.3
    }
}

animations {
    enabled = yes

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    bezier = overshot, 0.13, 0.99, 0.29, 1.1
    bezier = glitch, 0.5, -0.8, 0.5, 1.8

    animation = windows, 1, 7, overshot, slide
    animation = windowsIn, 1, 3, glitch, popin 90%
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 50, default, loop
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, overshot, slidevert
    animation = specialWorkspace, 1, 6, overshot, slidevert
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

#############
### INPUT ###
#############

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0.6

    touchpad {
        natural_scroll = true
    }
}

gesture = 3, horizontal, workspace

###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

# Standard Apps
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod SHIFT, B, exec, $browser
bind = $mainMod, R, exec, $menu

# Custom Hacker Utilities
bind = $mainMod, B, exec, ~/.config/hypr/scripts/hud_toggle.sh
# Super Ghost Terminal
bind = $mainMod, T, exec, [float;noborder;initialgame=0;size 100% 100%;pin;noshadow;noblur] kitty --class ghost_terminal knot
bind = $mainMod, W, exec, ~/.config/hypr/wallpaper.sh
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, P, exec, ~/.config/hypr/scripts/panic.sh
bind = $mainMod, Z, exec, ~/.config/hypr/scripts/zen.sh
bind = $mainMod, H, exec, [float;size 900 600;center] kitty --class floating_help ~/.config/hypr/scripts/help.sh
bind = , Print, exec, grim -g "$(slurp)" ~/Pictures/$(date +'%Y-%m-%d_%H-%M-%S').png && notify-send "Screenshot Captured"

# Window Management
bind = $mainMod, C, killactive
bind = $mainMod, V, exec, ~/.config/hypr/scripts/cycle_window.sh
bind = , Alt_L, exec, ~/.config/hypr/scripts/dashboard_toggle.sh
bind = $mainMod, M, exit

# Focus movement
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# 5 WORKSPACES ONLY + Dynamic Wallpaper
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 1, exec, ~/.config/hypr/wallpaper.sh 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 2, exec, ~/.config/hypr/wallpaper.sh 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 3, exec, ~/.config/hypr/wallpaper.sh 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 4, exec, ~/.config/hypr/wallpaper.sh 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 5, exec, ~/.config/hypr/wallpaper.sh 5

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# Dropdown Terminal (Special Workspace)
bind = $mainMod, G, togglespecialworkspace, dropdown

# Toggle Effects
bind = $mainMod, F, exec, hyprctl keyword decoration:blur:enabled $(hyprctl getoption decoration:blur:enabled | grep -q "int: 1" && echo 0 || echo 1)
bind = $mainMod, O, exec, hyprctl setprop active opaque toggle

# Scratchpad
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Mouse binds
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Volume & brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

bindel = ,XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl set 5%-
