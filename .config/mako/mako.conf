# Mako Configuration
# See https://github.com/emersion/mako/wiki/Configuration for more options

# General
# output = *
# layer = top
# x = 0
# y = 0
# width = 0
# height = 0
# margin = 10
# padding = 10
# border_size = 2
# border_color = #00000000

# Colors
# You can use a color scheme from pywal
# include ~/.cache/wal/colors-mako.dconf

# Font
# font = sans-serif 10

# Appearance
# default_timeout = 5
# max_visible = 5
# wrap = true
# anchor = top-center

# Actions
# action_priority = $action_priority

# Ignore rule
# ignore_dbus_path = /org/freedesktop/Notifications
# ignore_dbus_name = org.freedesktop.Notifications

# Rules
# rule: [overlay]: <regex> <action>
# rule: [ignore]: <regex> <action>
# rule: [output]: <regex> <output>
# rule: [layer]: <regex> <layer>
# rule: [margin]: <regex> <margin>
# rule: [padding]: <regex> <padding>
# rule: [border_size]: <regex> <border_size>
# rule: [border_color]: <regex> <border_color>
# rule: [background_color]: <regex> <background_color>
# rule: [text_color]: <regex> <text_color>
# rule: [font]: <regex> <font>
# rule: [timeout]: <regex> <timeout>
# rule: [max_visible]: <regex> <max_visible>
# rule: [format]: <regex> <format>
# rule: [actions]: <regex> <actions>
