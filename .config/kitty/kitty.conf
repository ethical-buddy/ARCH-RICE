# Include the colors generated by pywal
include ~/.cache/wal/colors-kitty.conf

# background opacity 0.0 = fully transparent, 1.0 = opaque

map ctrl+shift+t new_tab

allow_remote_control yes
listen_on unix:/tmp/mykitty

map ctrl+e remote_control set-background-opacity +0.8
map ctrl+shift+e remote_control set-background-opacity 0.1

# Default terminal (Ghostly but visible text)
background_opacity 0.0
dynamic_background_opacity yes

# Global Padding - Reducing to 5 for a clean look without wasted space
window_padding_width 5

# HUD Windows (Fully Transparent)
class clock_hud
  background_opacity 0.0
  draw_borders no
  window_padding_width 0

class net_hud
  background_opacity 0.0
  draw_borders no
  window_padding_width 0

# Utility Windows (Opaque so you can actually read the menus)
class network_manager
  background_opacity 1.0
  window_padding_width 10

class blueman-manager
  background_opacity 1.0
  window_padding_width 10

class floating_help
  background_opacity 0.9
  window_padding_width 10

# Ghost Notepad Window (SUPER+T)
class ghost_terminal
  background_opacity 0.0
  draw_borders no
  disable_ligatures never
  font_size 20.0
  window_padding_width 5
  hide_window_decorations yes
  confirm_os_window_close 0

font_size 14.0
modify_lines line_height 110%

# BEGIN_KITTY_THEME
# Adwaita darker
include current-theme.conf
# END_KITTY_THEME

# BEGIN_KITTY_FONTS
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
